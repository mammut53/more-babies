configurations {
    mainImplementation
}

dependencies {
    implementation "org.spongepowered:mixin:0.8.7-SNAPSHOT"
    implementation 'org.ow2.asm:asm:9.5'
    // implementation "eu.midnightdust:midnightlib:${project.midnightlib_version}-fabric"

    fabricModImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api}"
    /*fabricModImplementation "maven.modrinth:modmenu:${modmenu}"
    fabricModImplementation "eu.midnightdust:midnightlib:${project.midnightlib_version}-fabric"
    fabricInclude "eu.midnightdust:midnightlib:${project.midnightlib_version}-fabric"

    neoforgeModImplementation "eu.midnightdust:midnightlib:${project.midnightlib_version}-neoforge"
    neoforgeInclude "eu.midnightdust:midnightlib:${project.midnightlib_version}-neoforge"*/
}

processResources {
    inputs.property "version", version

    filesMatching("pack.mcmeta") {
        expand project.properties
    }
}

processFabricResources {
    inputs.property "version", version

    filesMatching("fabric.mod.json") {
        expand project.properties
    }
}
/*
processNeoforgeResources {
    inputs.property "version", version

    filesMatching("META-INF/neoforge.mods.toml") {
        expand project.properties
    }
}*/

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

tasks.withType(Jar).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from("LICENSE")
}

tasks.named("remapFabricJar") {
    archiveFileName = "${mod_name}-${version}-fabric+mc${minecraft_version}.jar"
}
