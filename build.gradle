plugins {
    id "java"
    id "xyz.wagyourtail.unimined" version "1.4.2-SNAPSHOT"
}

group group
version version

base {
    archivesName = mod_name
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }

    withSourcesJar()
}

sourceSets {
    fabric
}

repositories {
    unimined.spongeMaven()
    unimined.modrinthMaven()
    unimined.wagYourMaven("releases")

    maven {
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/"
    }

}

unimined.minecraft(sourceSets.main) {
    version minecraft_version

    mappings {}

    accessWidener {
        accessWidener "${projectDir}/src/main/resources/${mod_id}.classtweaker"
    }

    if (sourceSet == sourceSets.main) {
        defaultRemapJar = false
    }

    runs {
        off = true
    }
}

unimined.minecraft(sourceSets.fabric) {
    combineWith(sourceSets.main)

    fabric {
        loader fabric_loader
        accessWidener "${projectDir}/src/main/resources/${mod_id}.classtweaker"
    }

    defaultRemapJar = true

    runs {
        off = false

        config("client") {
            jvmArgs += "-XX:+AllowEnhancedClassRedefinition"
            args += ["--quickPlaySingleplayer", "More Babies Test World 26_2"]

            def mixinJar = configurations.runtimeClasspath.files.find { it.name.contains("mixin") }
            if (mixinJar != null) {
                jvmArgs += "-javaagent:${mixinJar.absolutePath}"
            }

            workingDir = file("$projectDir/run/fabric/client")
        }

        config("server") {
            jvmArgs += "-XX:+AllowEnhancedClassRedefinition"

            def mixinJar = configurations.runtimeClasspath.files.find { it.name.contains("mixin") }
            if (mixinJar != null) {
                jvmArgs += "-javaagent:${mixinJar.absolutePath}"
            }

            workingDir = file("$projectDir/run/fabric/server")
        }
    }
}

